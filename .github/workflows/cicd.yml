# .github/workflows/cicd.yml (개선된 버전)

name: ODG-Backend CI/CD v2

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 가져오기 (이전과 동일)
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Docker Hub 로그인 (이전과 동일)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Docker 이미지 빌드 및 푸시 (이전과 동일)
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/team-b-25-1-be:latest

      # 4. 배포 파일을 EC2에 복사 (새로운 단계!)
      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          source: "deploy/*"  # deploy 폴더 안의 모든 파일을
          target: "/home/ubuntu/app" # EC2의 app 폴더로 복사

      # 5. EC2에 접속하여 배포 실행 (스크립트 대폭 수정)
      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USERNAME }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USERNAME=${{ secrets.DB_USERNAME }}
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            
            # 작업 디렉터리로 이동
            cd /home/ubuntu/app
            
            # .env 파일 생성 (이전과 동일)
            cat << EOF > .env
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            EOF
            
            # Docker Hub 로그인 (중요!)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # docker-compose로 실행
            docker-compose --pull -f docker-compose.yml up -d
            
            # 사용하지 않는 이미지 정리
            docker image prune -af