# docker-compose.yml
version: '3.8'

services:
  # Spring Boot Application
  app:
    # GitHub Actions가 빌드해서 Docker Hub에 올린 이미지를 사용
    image: ${DOCKERHUB_USERNAME}/team-b-25-1-be:latest
    container_name: odg-backend
    restart: always
    # .env 파일에 저장된 환경 변수들을 컨테이너 내부로 주입
    env_file:
      - ./.env

  # Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80" # 외부의 80번 포트 요청을 Nginx가 받도록 설정
    volumes:
      # 위에서 만든 nginx.conf 파일을 Nginx 컨테이너의 설정 파일로 사용
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app # app 서비스가 시작된 후에 nginx가 시작되도록 보장